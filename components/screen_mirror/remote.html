<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESPHome Screen Mirror</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #070e1b; color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px;
    }
    .header { margin-bottom: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .badge {
      background: #0f1929; border: 1px solid #1e293b; padding: 6px 12px; border-radius: 8px;
      font-size: 13px; font-weight: 500; color: #94a3b8;
    }
    .badge span { color: #38bdf8; font-weight: 600; }
    .screen-container {
      position: relative; display: inline-block;
      box-shadow: 0 20px 30px -10px rgba(0,0,0,0.6), 0 10px 15px -5px rgba(0,0,0,0.4);
      border-radius: 12px; overflow: hidden; border: 2px solid #1e293b; background: #000;
    }
    #screenCanvas { display: block; max-width: 90vw; max-height: 80vh; width: auto; height: auto; cursor: crosshair; }
    .ripple {
      position: absolute; width: 28px; height: 28px; background: rgba(56, 189, 248, 0.5);
      border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%) scale(0);
      animation: ripple-anim 0.35s ease-out forwards; pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: translate(-50%, -50%) scale(2.0); opacity: 0; } }
    .status { margin-top: 14px; font-size: 13px; color: #64748b; }
    .btn-group { margin-top: 10px; display: flex; gap: 8px; }
    button {
      background: #1e293b; border: 1px solid #334155; color: #cbd5e1;
      padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #334155; color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">Device: <span id="res">-</span></div>
    <div class="badge">Orientation: <span id="rot">0°</span></div>
    <div class="badge">Latency: <span id="lat">-</span> ms</div>
    <div class="badge">Mode: <span id="mode" style="color: #10b981">Live Mirror</span></div>
    <div class="badge">Status: <span id="stat" style="color: #10b981">Connected</span></div>
  </div>
  <div class="screen-container" id="container">
    <canvas id="screenCanvas"></canvas>
  </div>
  <div class="status">Click or tap anywhere on the screen to simulate touch</div>
  <div class="btn-group">
    <button onclick="refreshScreen(true)">Snapshot (Refresh)</button>
    <button onclick="window.open('/screenshot.jpg', '_blank')">Full JPEG</button>
    <button onclick="window.open('/screenshot.bmp', '_blank')">Raw BMP</button>
  </div>
  <script>
    const canvas = document.getElementById('screenCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');
    const latSpan = document.getElementById('lat');
    const resSpan = document.getElementById('res');
    const rotSpan = document.getElementById('rot');

    let isRefreshing = false;
    let rotation = /*%ROTATION%*/ 0;
    let hwWidth = 800;
    let hwHeight = 480;

    function ensureCanvasSize() {
      const targetW = (rotation === 90 || rotation === 270) ? hwHeight : hwWidth;
      const targetH = (rotation === 90 || rotation === 270) ? hwWidth : hwHeight;
      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
      }
    }
    ensureCanvasSize();
    if (rotSpan) rotSpan.textContent = `${rotation}°`;
    if (resSpan) {
      resSpan.textContent = (rotation === 90 || rotation === 270)
        ? `${hwHeight}×${hwWidth}`
        : `${hwWidth}×${hwHeight}`;
    }

    async function updateInfo() {
      try {
        const res = await fetch('/mirror/info');
        const data = await res.json();
        hwWidth = data.width || hwWidth;
        hwHeight = data.height || hwHeight;
        if (typeof data.rotation === 'number') {
          rotation = data.rotation;
        }
        rotSpan.textContent = `${rotation}°`;

        if (rotation === 90 || rotation === 270) {
          resSpan.textContent = `${hwHeight}×${hwWidth}`;
        } else {
          resSpan.textContent = `${hwWidth}×${hwHeight}`;
        }
        ensureCanvasSize();
      } catch (e) {}
    }
    updateInfo();

    function initStream() {
      startContinuousPolling();
    }

    let lastRenderedTime = 0;
    let pollingActive = true;

    function refreshScreen(manual = false) {
      if (manual && wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        ws.send('K');
        return Promise.resolve();
      }
      if (isRefreshing && !manual) return Promise.resolve();
      isRefreshing = true;
      const reqTime = performance.now();
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          if (reqTime >= lastRenderedTime) {
            lastRenderedTime = reqTime;
            latSpan.textContent = Math.round(performance.now() - reqTime);
            drawRotated(img);
          }
          isRefreshing = false;
          resolve();
        };
        img.onerror = () => {
          isRefreshing = false;
          resolve();
        };
        img.src = '/screenshot.jpg?t=' + Date.now();
      });
    }

    async function startContinuousPolling() {
      while (pollingActive) {
        await refreshScreen(false);
        // Rest at least 120ms between frames so ESP32 HTTP worker thread is not saturated
        await new Promise((r) => setTimeout(r, 120));
      }
    }


    function drawTile(img, x, y, w, h) {
      ensureCanvasSize();
      ctx.save();
      if (rotation === 90) {
        // 90 deg CCW (270 deg) brings the buffer upright
        ctx.translate(0, canvas.height);
        ctx.rotate(270 * Math.PI / 180);
      } else if (rotation === 180) {
        ctx.translate(canvas.width, canvas.height);
        ctx.rotate(180 * Math.PI / 180);
      } else if (rotation === 270) {
        ctx.translate(canvas.width, 0);
        ctx.rotate(90 * Math.PI / 180);
      }
      ctx.drawImage(img, x, y);
      ctx.restore();
    }

    function drawRotated(img) {
      drawTile(img, 0, 0, hwWidth, hwHeight);
    }

    function clientToRaw(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      // Coordinate in the visible canvas space
      const dispX = Math.round(clickX * (canvas.width / rect.width));
      const dispY = Math.round(clickY * (canvas.height / rect.height));

      // Map from rotated canvas coordinates back to raw unrotated hardware framebuffer coordinates
      let rawX, rawY;
      if (rotation === 90) {
        rawX = hwWidth - dispY - 1;
        rawY = dispX;
      } else if (rotation === 180) {
        rawX = hwWidth - dispX - 1;
        rawY = hwHeight - dispY - 1;
      } else if (rotation === 270) {
        rawX = dispY;
        rawY = hwHeight - dispX - 1;
      } else {
        rawX = dispX;
        rawY = dispY;
      }

      rawX = Math.max(0, Math.min(hwWidth - 1, Math.round(rawX)));
      rawY = Math.max(0, Math.min(hwHeight - 1, Math.round(rawY)));
      return { clickX, clickY, rawX, rawY };
    }

    function showRipple(clickX, clickY) {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = clickX + 'px';
      ripple.style.top = clickY + 'px';
      container.appendChild(ripple);
      setTimeout(() => ripple.remove(), 400);
    }

    let ws = null;
    let wsConnected = false;
    let frameTimes = [];

    function updateFpsCounter() {
      const now = performance.now();
      frameTimes.push(now);
      while (frameTimes.length > 0 && frameTimes[0] < now - 1000) {
        frameTimes.shift();
      }
      const lat = document.getElementById('lat');
      if (lat && frameTimes.length > 0) {
        lat.textContent = `${frameTimes.length} fps`;
      }
    }

    function initWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;
      try {
        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => {
          wsConnected = true;
          const stat = document.getElementById('stat');
          if (stat) stat.textContent = 'WS Connected';
          const mode = document.getElementById('mode');
          if (mode) mode.textContent = 'Delta WS (LVGL)';
          // Suspend HTTP polling because WebSocket pushes dirty tile updates
          pollingActive = false;
          // Request full keyframe once WebSocket handshake is established
          ws.send('K');
        };
        ws.onclose = () => {
          wsConnected = false;
          const stat = document.getElementById('stat');
          if (stat) stat.textContent = 'HTTP Fallback';
          const mode = document.getElementById('mode');
          if (mode) mode.textContent = 'Live Mirror';
          // Resume HTTP polling if WebSocket closes
          if (!pollingActive) {
            pollingActive = true;
            startContinuousPolling();
          }
          setTimeout(initWebSocket, 2000);
        };
        ws.onerror = () => {
          wsConnected = false;
          ws.close();
        };
        let renderChain = Promise.resolve();

        ws.onmessage = (event) => {
          if (typeof event.data === 'string') return;
          if (!(event.data instanceof ArrayBuffer)) return;

          const buf = event.data;
          if (buf.byteLength < 10) return;

          const view = new DataView(buf);
          const magic = view.getUint8(0);
          const flags = view.getUint8(1);
          const x = (view.getUint8(2) << 8) | view.getUint8(3);
          const y = (view.getUint8(4) << 8) | view.getUint8(5);
          const w = (view.getUint8(6) << 8) | view.getUint8(7);
          const h = (view.getUint8(8) << 8) | view.getUint8(9);

          const packetRot = ((flags >> 2) & 0x03) * 90;
          if (packetRot !== rotation) {
            rotation = packetRot;
            ensureCanvasSize();
            if (rotSpan) rotSpan.textContent = `${rotation}°`;
            if (resSpan) {
              resSpan.textContent = (rotation === 90 || rotation === 270)
                ? `${hwHeight}×${hwWidth}`
                : `${hwWidth}×${hwHeight}`;
            }
          }

          const jpegSlice = buf.slice(10);
          const blob = new Blob([jpegSlice], { type: 'image/jpeg' });

          const renderTile = (imgSource) => {
            if (magic === 0x46 && w > 0 && h > 0) {
              hwWidth = w;
              hwHeight = h;
            }
            drawTile(imgSource, x, y, w, h);
            updateFpsCounter();
          };

          renderChain = renderChain.then(async () => {
            try {
              if (window.createImageBitmap) {
                const bmp = await createImageBitmap(blob);
                renderTile(bmp);
                bmp.close();
              } else {
                await new Promise((resolve) => {
                  const img = new Image();
                  img.onload = () => {
                    renderTile(img);
                    URL.revokeObjectURL(img.src);
                    resolve();
                  };
                  img.onerror = resolve;
                  img.src = URL.createObjectURL(blob);
                });
              }
            } catch (e) {}
          });
        };
      } catch (e) {
        wsConnected = false;
      }
    }

    function sendTouch(rawX, rawY, action) {
      if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        if (action === 'tap') {
          ws.send(`T ${rawX} ${rawY}`);
        } else if (action === 'down') {
          ws.send(`D ${rawX} ${rawY}`);
        } else if (action === 'move') {
          ws.send(`M ${rawX} ${rawY}`);
        } else if (action === 'up') {
          ws.send(`U ${rawX} ${rawY}`);
        }
        return;
      }

      // Graceful fallback to HTTP POST
      try {
        if (action === 'tap') {
          fetch(`/tap?x=${rawX}&y=${rawY}&duration=180`, { method: 'POST', body: '' });
        } else {
          fetch(`/touch?x=${rawX}&y=${rawY}&action=${action}`, { method: 'POST', body: '' });
        }
      } catch (err) {
        console.error('Touch error:', err);
      }
    }

    let isPointerDown = false;
    let pointerMoved = false;
    let downSent = false;
    let pointerStartTime = 0;
    let lastMoveSent = 0;
    let startRawX = 0;
    let startRawY = 0;
    let holdTimer = null;

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      isPointerDown = true;
      pointerMoved = false;
      downSent = false;
      pointerStartTime = performance.now();
      lastMoveSent = performance.now();

      const { clickX, clickY, rawX, rawY } = clientToRaw(e.clientX, e.clientY);
      startRawX = rawX;
      startRawY = rawY;
      showRipple(clickX, clickY);

      // If user holds down without moving for > 250ms, initiate hold/drag on device
      if (holdTimer) clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        if (isPointerDown && !downSent) {
          downSent = true;
          sendTouch(startRawX, startRawY, 'down');
        }
      }, 250);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      e.preventDefault();
      const { rawX, rawY } = clientToRaw(e.clientX, e.clientY);
      const dist = Math.hypot(rawX - startRawX, rawY - startRawY);

      // Movement threshold: once moved more than 6px, treat as drag
      if (!pointerMoved && dist > 6) {
        pointerMoved = true;
        if (!downSent) {
          if (holdTimer) clearTimeout(holdTimer);
          downSent = true;
          sendTouch(startRawX, startRawY, 'down');
        }
      }

      if (downSent) {
        const now = performance.now();
        // Throttle movement events to ~20ms (50Hz) for smooth real-time drag
        if (now - lastMoveSent >= 20) {
          lastMoveSent = now;
          sendTouch(rawX, rawY, 'move');
        }
      }
    });

    const handlePointerUp = (e) => {
      if (!isPointerDown) return;
      e.preventDefault();
      isPointerDown = false;
      if (holdTimer) clearTimeout(holdTimer);
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}

      const { rawX, rawY } = clientToRaw(e.clientX, e.clientY);
      const duration = performance.now() - pointerStartTime;

      if (!downSent && !pointerMoved && duration < 350) {
        // Crisp single tap/click: tell the device to perform simulated tap (80ms)
        sendTouch(rawX, rawY, 'tap');
      } else {
        if (!downSent) {
          // If down was never sent (e.g. released just before hold timer without movement)
          sendTouch(startRawX, startRawY, 'down');
        }
        sendTouch(rawX, rawY, 'up');
      }
    };

    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerUp);

    initWebSocket();
    initStream();
  </script>
</body>
</html>
