<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ESPHome Screen Mirror</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      overscroll-behavior: none;
      overflow-x: hidden;
    }
    body {
      margin: 0; background: #070e1b; color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 12px;
      touch-action: manipulation;
    }
    .header { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .badge {
      background: #0f1929; border: 1px solid #1e293b; padding: 6px 12px; border-radius: 8px;
      font-size: 13px; font-weight: 500; color: #94a3b8;
    }
    .badge span { color: #38bdf8; font-weight: 600; }
    .screen-container {
      position: relative; display: inline-block;
      box-shadow: 0 20px 30px -10px rgba(0,0,0,0.6), 0 10px 15px -5px rgba(0,0,0,0.4);
      border-radius: 12px; overflow: hidden; border: 2px solid #1e293b; background: #000;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #screenCanvas {
      display: block;
      max-width: 95vw;
      max-height: calc(100dvh - 160px);
      width: auto; height: auto; cursor: crosshair;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      transition: filter 0.2s ease;
    }
    #screenCanvas.dimmed {
      filter: brightness(0.6);
    }
    .screen-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.2s ease;
      touch-action: none;
    }
    .screen-overlay.hidden {
      display: none;
    }
    .banner {
      background: rgba(15, 25, 41, 0.92);
      border: 1.5px solid #334155;
      color: #f1f5f9;
      padding: 16px 36px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.75px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      user-select: none;
      -webkit-user-select: none;
    }
    .ripple {
      position: absolute; width: 28px; height: 28px; background: rgba(56, 189, 248, 0.5);
      border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%) scale(0);
      animation: ripple-anim 0.35s ease-out forwards; pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: translate(-50%, -50%) scale(2.0); opacity: 0; } }
    .status { margin-top: 12px; font-size: 13px; color: #64748b; text-align: center; }
    .btn-group { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button {
      background: #1e293b; border: 1px solid #334155; color: #cbd5e1;
      padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s;
    }
    button:hover { background: #334155; color: #fff; }
    @media (max-width: 600px) {
      body { padding: 8px; }
      .header { gap: 6px; margin-bottom: 8px; }
      .badge { font-size: 11px; padding: 4px 8px; }
      .banner { font-size: 16px; padding: 12px 24px; }
      #screenCanvas { max-height: calc(100dvh - 140px); }
      .status { margin-top: 8px; font-size: 12px; }
      .btn-group { margin-top: 8px; gap: 6px; }
      button { padding: 6px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">Device: <span id="res">-</span></div>
    <div class="badge">Orientation: <span id="rot">0°</span></div>
    <div class="badge"><span id="metricLbl">Rate</span>: <span id="lat">-</span></div>
    <div class="badge">Mode: <span id="mode" style="color: #10b981">Live Mirror</span></div>
    <div class="badge">Status: <span id="stat" style="color: #10b981">Connected</span></div>
  </div>
  <div class="screen-container dimmed" id="container">
    <canvas id="screenCanvas" class="dimmed" style="filter: brightness(0.6)"></canvas>
    <div class="screen-overlay" id="screenOverlay">
      <div class="banner" id="banner">Connecting</div>
    </div>
  </div>
  <div class="status">Click or tap anywhere on the screen to simulate touch</div>
  <div class="btn-group">
    <button onclick="refreshScreen(true)">Snapshot (Refresh)</button>
    <button onclick="window.open('/screenshot.jpg', '_blank')">Full JPEG</button>
    <button onclick="window.open('/screenshot.bmp', '_blank')">Raw BMP</button>
  </div>
  <script>
    const canvas = document.getElementById('screenCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');
    const metricLbl = document.getElementById('metricLbl');
    const latSpan = document.getElementById('lat');
    const resSpan = document.getElementById('res');
    const rotSpan = document.getElementById('rot');
    const screenOverlay = document.getElementById('screenOverlay');
    const banner = document.getElementById('banner');

    function showBanner(text) {
      if (banner) banner.textContent = text;
      if (screenOverlay) {
        screenOverlay.style.display = 'flex';
        if (screenOverlay.classList) screenOverlay.classList.remove('hidden');
      }
      if (canvas) {
        canvas.style.filter = 'brightness(0.6)';
        if (canvas.classList) canvas.classList.add('dimmed');
      }
      if (container && container.classList) {
        container.classList.add('dimmed');
      }
    }

    function hideBanner() {
      if (screenOverlay) {
        screenOverlay.style.display = 'none';
        if (screenOverlay.classList) screenOverlay.classList.add('hidden');
      }
      if (canvas) {
        canvas.style.filter = '';
        if (canvas.classList) canvas.classList.remove('dimmed');
      }
      if (container && container.classList) {
        container.classList.remove('dimmed');
      }
    }

    showBanner('Connecting');

    let isRefreshing = false;
    let rotation = /*%ROTATION%*/ 0;
    let hwWidth = 800;
    let hwHeight = 480;

    function ensureCanvasSize() {
      const targetW = (rotation === 90 || rotation === 270) ? hwHeight : hwWidth;
      const targetH = (rotation === 90 || rotation === 270) ? hwWidth : hwHeight;
      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
      }
    }
    ensureCanvasSize();
    if (rotSpan) rotSpan.textContent = `${rotation}°`;
    if (resSpan) {
      resSpan.textContent = (rotation === 90 || rotation === 270)
        ? `${hwHeight}×${hwWidth}`
        : `${hwWidth}×${hwHeight}`;
    }

    async function updateInfo() {
      try {
        const res = await fetch('/mirror/info');
        const data = await res.json();
        hwWidth = data.width || hwWidth;
        hwHeight = data.height || hwHeight;
        if (typeof data.rotation === 'number') {
          rotation = data.rotation;
        }
        rotSpan.textContent = `${rotation}°`;

        if (rotation === 90 || rotation === 270) {
          resSpan.textContent = `${hwHeight}×${hwWidth}`;
        } else {
          resSpan.textContent = `${hwWidth}×${hwHeight}`;
        }
        ensureCanvasSize();
      } catch (e) {}
    }
    updateInfo();

    let lastRenderedTime = 0;
    let pollingActive = false;

    let consecutivePollErrors = 0;

    function refreshScreen(manual = false) {
      if (manual && wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        ws.send('K');
        return Promise.resolve();
      }
      if (isRefreshing && !manual) return Promise.resolve();
      isRefreshing = true;
      const reqTime = performance.now();
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          consecutivePollErrors = 0;
          if (reqTime >= lastRenderedTime) {
            lastRenderedTime = reqTime;
            if (metricLbl) metricLbl.textContent = 'Latency';
            latSpan.textContent = `${Math.round(performance.now() - reqTime)} ms`;
            drawRotated(img);
            hideBanner();
          }
          isRefreshing = false;
          resolve();
        };
        img.onerror = () => {
          consecutivePollErrors++;
          if (document.visibilityState !== 'hidden') {
            showBanner('Connecting');
          }
          isRefreshing = false;
          resolve();
        };
        img.src = '/screenshot.jpg?t=' + Date.now();
      });
    }

    async function startContinuousPolling() {
      while (pollingActive && document.visibilityState !== 'hidden') {
        await refreshScreen(false);
        // Rest at least 120ms between frames; back off up to 2000ms if requests fail (e.g. during OTA 503)
        const delay = consecutivePollErrors > 0
          ? Math.min(2000, 1000 + (consecutivePollErrors - 1) * 500)
          : 120;
        await new Promise((r) => setTimeout(r, delay));
      }
    }


    function drawTile(img, x, y, w, h) {
      ensureCanvasSize();
      ctx.save();
      if (rotation === 90) {
        // 90 deg CCW (270 deg) brings the buffer upright
        ctx.translate(0, canvas.height);
        ctx.rotate(270 * Math.PI / 180);
      } else if (rotation === 180) {
        ctx.translate(canvas.width, canvas.height);
        ctx.rotate(180 * Math.PI / 180);
      } else if (rotation === 270) {
        ctx.translate(canvas.width, 0);
        ctx.rotate(90 * Math.PI / 180);
      }
      ctx.drawImage(img, x, y);
      ctx.restore();
    }

    function drawRotated(img) {
      // /screenshot.jpg includes EXIF orientation, so browsers auto-orient the image upright (0°, 90°, 180°, 270°)
      ctx.drawImage(img, 0, 0);
    }

    function clientToRaw(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      // Coordinate in the visible canvas space
      const dispX = Math.round(clickX * (canvas.width / rect.width));
      const dispY = Math.round(clickY * (canvas.height / rect.height));

      // Map from rotated canvas coordinates back to raw unrotated hardware framebuffer coordinates
      let rawX, rawY;
      if (rotation === 90) {
        rawX = hwWidth - dispY - 1;
        rawY = dispX;
      } else if (rotation === 180) {
        rawX = hwWidth - dispX - 1;
        rawY = hwHeight - dispY - 1;
      } else if (rotation === 270) {
        rawX = dispY;
        rawY = hwHeight - dispX - 1;
      } else {
        rawX = dispX;
        rawY = dispY;
      }

      rawX = Math.max(0, Math.min(hwWidth - 1, Math.round(rawX)));
      rawY = Math.max(0, Math.min(hwHeight - 1, Math.round(rawY)));
      return { clickX, clickY, rawX, rawY };
    }

    function showRipple(clickX, clickY) {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = clickX + 'px';
      ripple.style.top = clickY + 'px';
      container.appendChild(ripple);
      setTimeout(() => ripple.remove(), 400);
    }

    let ws = null;
    let wsConnected = false;
    let frameTimes = [];
    let isDecoding = false;
    let pendingQueue = [];
    const MAX_PENDING = 2;
    let lastKeyframeRecovery = -1000;

    function updateFpsCounter() {
      const now = performance.now();
      frameTimes.push(now);
      while (frameTimes.length > 0 && frameTimes[0] < now - 1000) {
        frameTimes.shift();
      }
      if (metricLbl) metricLbl.textContent = 'Rate';
      if (latSpan) {
        latSpan.textContent = `${frameTimes.length} fps`;
      }
    }

    function requestKeyframeRecovery() {
      const now = performance.now();
      if (wsConnected && ws && ws.readyState === WebSocket.OPEN && (now - lastKeyframeRecovery > 1000)) {
        lastKeyframeRecovery = now;
        ws.send('K');
      }
    }

    const renderTile = (imgSource, magic, x, y, w, h) => {
      if (magic === 0x46 && w > 0 && h > 0) {
        hwWidth = w;
        hwHeight = h;
      }
      drawTile(imgSource, x, y, w, h);
      updateFpsCounter();
    };

    async function processQueue() {
      if (isDecoding) return;
      isDecoding = true;
      while (pendingQueue.length > 0) {
        const frame = pendingQueue.shift();
        try {
          if (window.createImageBitmap) {
            const bmp = await createImageBitmap(frame.blob);
            renderTile(bmp, frame.magic, frame.x, frame.y, frame.w, frame.h);
            bmp.close();
          } else {
            await new Promise((resolve) => {
              const img = new Image();
              img.onload = () => {
                renderTile(img, frame.magic, frame.x, frame.y, frame.w, frame.h);
                URL.revokeObjectURL(img.src);
                resolve();
              };
              img.onerror = () => {
                URL.revokeObjectURL(img.src);
                requestKeyframeRecovery();
                resolve();
              };
              img.src = URL.createObjectURL(frame.blob);
            });
          }
        } catch (e) {
          requestKeyframeRecovery();
        }
      }
      isDecoding = false;
    }

    let wsRetryAttempts = 0;
    let wsRetryTimer = null;

    function scheduleWsReconnect() {
      if (wsRetryTimer) {
        clearTimeout(wsRetryTimer);
        wsRetryTimer = null;
      }
      if (document.visibilityState === 'hidden') {
        return;
      }
      // Exponential backoff: 2s -> 4s -> 8s -> max 16s
      const delay = Math.min(16000, 2000 * Math.pow(2, Math.min(wsRetryAttempts, 3)));
      wsRetryAttempts++;
      wsRetryTimer = setTimeout(() => {
        wsRetryTimer = null;
        initWebSocket();
      }, delay);
    }

    function initWebSocket() {
      if (wsRetryTimer) {
        clearTimeout(wsRetryTimer);
        wsRetryTimer = null;
      }
      if (document.visibilityState === 'hidden') {
        return;
      }
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }
      showBanner('Connecting');
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;
      try {
        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => {
          // Suspend HTTP polling because WebSocket handshake was established
          pollingActive = false;
          // Request full keyframe once WebSocket handshake is established
          ws.send('K');
        };
        ws.onclose = () => {
          wsConnected = false;
          pendingQueue = [];
          isDecoding = false;
          if (document.visibilityState === 'hidden') {
            const stat = document.getElementById('stat');
            if (stat) stat.textContent = 'Paused (Background)';
            showBanner('Disconnected');
            return;
          }
          showBanner('Connecting');
          const stat = document.getElementById('stat');
          if (stat) stat.textContent = 'HTTP Fallback';
          const mode = document.getElementById('mode');
          if (mode) mode.textContent = 'Live Mirror';
          if (metricLbl) metricLbl.textContent = 'Latency';
          if (latSpan) latSpan.textContent = '-';
          // Resume HTTP polling if WebSocket closes
          if (!pollingActive) {
            pollingActive = true;
            startContinuousPolling();
          }
          scheduleWsReconnect();
        };
        ws.onerror = () => {
          wsConnected = false;
          pendingQueue = [];
          isDecoding = false;
          ws.close();
        };

        ws.onmessage = (event) => {
          if (typeof event.data === 'string') return;
          if (!(event.data instanceof ArrayBuffer)) return;

          const buf = event.data;
          if (buf.byteLength < 10) return;

          // Gate 'WS Connected' and banner dismissal on receiving the first valid frame
          if (!wsConnected) {
            wsConnected = true;
            wsRetryAttempts = 0;
            hideBanner();
            const stat = document.getElementById('stat');
            if (stat) stat.textContent = 'WS Connected';
            const mode = document.getElementById('mode');
            if (mode) mode.textContent = 'Delta WS (LVGL)';
            if (metricLbl) metricLbl.textContent = 'Rate';
            if (latSpan) latSpan.textContent = '0 fps';
            pollingActive = false;
          }

          const view = new DataView(buf);
          const magic = view.getUint8(0);
          const flags = view.getUint8(1);
          const x = (view.getUint8(2) << 8) | view.getUint8(3);
          const y = (view.getUint8(4) << 8) | view.getUint8(5);
          const w = (view.getUint8(6) << 8) | view.getUint8(7);
          const h = (view.getUint8(8) << 8) | view.getUint8(9);

          const packetRot = ((flags >> 2) & 0x03) * 90;
          if (packetRot !== rotation) {
            rotation = packetRot;
            ensureCanvasSize();
            if (rotSpan) rotSpan.textContent = `${rotation}°`;
            if (resSpan) {
              resSpan.textContent = (rotation === 90 || rotation === 270)
                ? `${hwHeight}×${hwWidth}`
                : `${hwWidth}×${hwHeight}`;
            }
          }

          // If a keyframe arrives, any queued delta tiles are obsolete and can be dropped
          if (magic === 0x46) {
            pendingQueue.length = 0;
          } else if (pendingQueue.length >= MAX_PENDING) {
            // Drop oldest pending tile to prevent memory accumulation under slow decoding
            pendingQueue.shift();
          }

          const jpegSlice = buf.slice(10);
          const blob = new Blob([jpegSlice], { type: 'image/jpeg' });
          pendingQueue.push({ magic, x, y, w, h, blob });

          processQueue();
        };
      } catch (e) {
        wsConnected = false;
      }
    }

    function sendTouch(rawX, rawY, action) {
      if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        if (action === 'tap') {
          ws.send(`T ${rawX} ${rawY}`);
        } else if (action === 'down') {
          ws.send(`D ${rawX} ${rawY}`);
        } else if (action === 'move') {
          ws.send(`M ${rawX} ${rawY}`);
        } else if (action === 'up') {
          ws.send(`U ${rawX} ${rawY}`);
        }
        return;
      }

      // Graceful fallback to HTTP POST
      try {
        if (action === 'tap') {
          fetch(`/tap?x=${rawX}&y=${rawY}&duration=180`, { method: 'POST', body: '' });
        } else {
          fetch(`/touch?x=${rawX}&y=${rawY}&action=${action}`, { method: 'POST', body: '' });
        }
      } catch (err) {
        console.error('Touch error:', err);
      }
    }

    let isPointerDown = false;
    let pointerMoved = false;
    let downSent = false;
    let pointerStartTime = 0;
    let lastMoveSent = 0;
    let startRawX = 0;
    let startRawY = 0;
    let holdTimer = null;

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      isPointerDown = true;
      pointerMoved = false;
      downSent = false;
      pointerStartTime = performance.now();
      lastMoveSent = performance.now();

      const { clickX, clickY, rawX, rawY } = clientToRaw(e.clientX, e.clientY);
      startRawX = rawX;
      startRawY = rawY;
      showRipple(clickX, clickY);

      // If user holds down without moving for > 250ms, initiate hold/drag on device
      if (holdTimer) clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        if (isPointerDown && !downSent) {
          downSent = true;
          sendTouch(startRawX, startRawY, 'down');
        }
      }, 250);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      e.preventDefault();
      const { rawX, rawY } = clientToRaw(e.clientX, e.clientY);
      const dist = Math.hypot(rawX - startRawX, rawY - startRawY);

      // Movement threshold: once moved more than 6px, treat as drag
      if (!pointerMoved && dist > 6) {
        pointerMoved = true;
        if (!downSent) {
          if (holdTimer) clearTimeout(holdTimer);
          downSent = true;
          sendTouch(startRawX, startRawY, 'down');
        }
      }

      if (downSent) {
        const now = performance.now();
        // Throttle movement events to ~20ms (50Hz) for smooth real-time drag
        if (now - lastMoveSent >= 20) {
          lastMoveSent = now;
          sendTouch(rawX, rawY, 'move');
        }
      }
    });

    const handlePointerUp = (e) => {
      if (!isPointerDown) return;
      e.preventDefault();
      isPointerDown = false;
      if (holdTimer) clearTimeout(holdTimer);
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}

      const { rawX, rawY } = clientToRaw(e.clientX, e.clientY);
      const duration = performance.now() - pointerStartTime;

      if (!downSent && !pointerMoved && duration < 350) {
        // Crisp single tap/click: tell the device to perform simulated tap (80ms)
        sendTouch(rawX, rawY, 'tap');
      } else {
        if (!downSent) {
          // If down was never sent (e.g. released just before hold timer without movement)
          sendTouch(startRawX, startRawY, 'down');
        }
        sendTouch(rawX, rawY, 'up');
      }
    };

    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerUp);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // Tab visibility lifecycle: disconnect WebSocket and suspend polling when backgrounded
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        if (wsRetryTimer) {
          clearTimeout(wsRetryTimer);
          wsRetryTimer = null;
        }
        pollingActive = false;
        if (ws) {
          try { ws.close(); } catch (e) {}
          ws = null;
        }
        wsConnected = false;
        pendingQueue = [];
        const stat = document.getElementById('stat');
        if (stat) stat.textContent = 'Paused (Background)';
        showBanner('Disconnected');
      } else {
        const stat = document.getElementById('stat');
        if (stat) stat.textContent = 'Reconnecting...';
        showBanner('Connecting');
        wsRetryAttempts = 0;
        initWebSocket();
      }
    });

    const cleanupConnections = () => {
      if (wsRetryTimer) {
        clearTimeout(wsRetryTimer);
        wsRetryTimer = null;
      }
      pollingActive = false;
      if (ws) {
        try { ws.close(); } catch (e) {}
        ws = null;
      }
      showBanner('Disconnected');
    };
    window.addEventListener('pagehide', cleanupConnections);
    window.addEventListener('beforeunload', cleanupConnections);

    initWebSocket();
    // Fallback: If WebSocket does not connect within 3.5s, activate HTTP snapshot polling
    setTimeout(() => {
      if (!wsConnected && !pollingActive && document.visibilityState !== 'hidden') {
        pollingActive = true;
        startContinuousPolling();
      }
    }, 3500);
  </script>
</body>
</html>
